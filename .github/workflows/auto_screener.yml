name: 小狼自动选股

on:
  schedule:
    # 北京时间 每天 08:30 / 10:30 / 14:00（GitHub Actions 用 UTC，去掉 1-5 即每天跑）
    - cron: '30 0 * * *'
    - cron: '30 2 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install akshare
      - name: 运行自动选股扫描(宽扫描，不按净流入预筛)
        run: python auto_screener.py 1000 0
      - name: 运行蓝筹长期价值选股(沪深300·可慢慢低吸)
        run: python blue_chip_screener.py
      - name: 策略回测验证(参数化 opt_backtest，防未来函数)
        run: python opt_backtest.py 600 > opt_run.log 2>&1 || true
      - name: 生成结果页(首页快照)
        run: python gen_auto_pick.py
      - name: 生成首页 index.html(Pages 根路径直达最新选股结果)
        run: cp auto_pick.html index.html
      - name: 运行策略体检/纠错机制(沪深300状态→仓位系数+动态止损)
        run: python strategy_guard.py
      - name: 监测国家队资金走向(宽基ETF成交活跃度+份额+市场状态)
        run: python national_team.py
      - name: 计算市场情绪指数(微博舆情NLP+市场代理→恐惧贪婪)
        run: python sentiment.py
      - name: 更新观察池(追踪自动选股输出的买入标的后续走向·自我纠正账本)
        run: python watch_pool.py
      - name: 生成综合研判总览(五维合成机会分+一句话研判)
        run: python overview.py
      - name: 烘焙快照进两个完整页面(离线兜底，联网时仍按 fetch 取最新)
        run: python sync_auto_tab.py
      - name: 提交更新
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "auto: 选股快照 $(date +%F)" || echo "no changes"
          git push || echo "push skipped"
      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
